# Runs install.ps1 on a real Windows machine against a published release,
# in both PowerShell 7 (pwsh) and Windows PowerShell 5.1, then checks that
# the installed pelt.exe works and that a bad checksum is refused.
#
# It runs after every release build, against the latest release; when
# install.ps1 changes; or by hand from the Actions tab with any version.
name: install-test

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release to install, e.g. v0.4.2 (empty for the latest)
        default: ""
  workflow_run:
    workflows: [release]
    types: [completed]
  push:
    branches: [main]
    paths:
      - install.ps1
      - .github/workflows/install-test.yml

permissions:
  contents: read

jobs:
  windows:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    runs-on: windows-latest
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      PELT_VERSION: ${{ inputs.version || 'latest' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the way users do (script text piped to iex)
        run: |
          $PSVersionTable.PSVersion.ToString()
          Get-Content -Raw .\install.ps1 | Invoke-Expression

      - name: Check the binary and the user PATH
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\pelt'
          $exe = Join-Path $dir 'pelt.exe'
          if (-not (Test-Path $exe)) { throw "pelt.exe not found at $exe" }
          $userPath = (Get-Item 'HKCU:\Environment').GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          if (($userPath -split ';') -notcontains $dir) { throw "user PATH does not contain $dir" }
          & $exe -h
          if ($LASTEXITCODE -ne 0) { throw "pelt -h exited with $LASTEXITCODE" }
          & $exe -version
          if ($LASTEXITCODE -ne 0) { 'This build has no -version flag (v0.4.2 or older).' }
          $global:LASTEXITCODE = 0

      - name: Set up Go (for Pelt's local test server)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Run a short load test against a local server
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\pelt\pelt.exe'
          go build -o testserver.exe ./cmd/testserver
          if ($LASTEXITCODE -ne 0) { throw 'could not build testserver' }
          $server = Start-Process .\testserver.exe -ArgumentList '-addr', '127.0.0.1:8080' -PassThru
          try {
            for ($i = 0; $i -lt 30; $i++) {
              try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8080/ | Out-Null; break } catch { Start-Sleep -Milliseconds 500 }
            }
            $json = & $exe -n 2000 -c 50 -quiet -o json http://127.0.0.1:8080/
            if ($LASTEXITCODE -ne 0) { throw "pelt exited with $LASTEXITCODE" }
            $r = ($json -join "`n") | ConvertFrom-Json
            "responses=$($r.responses) errors=$($r.errors) req/s=$($r.requests_per_sec) opened=$($r.connections_opened) reused=$($r.connections_reused)"
            if ($r.responses -ne 2000 -or $r.errors -ne 0 -or $r.status_codes.'200' -ne 2000) {
              $json
              throw 'expected 2000 responses with status 200 and no errors'
            }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Refuse a download whose checksum does not match
        run: |
          $mirror = Join-Path $env:RUNNER_TEMP 'mirror'
          New-Item -ItemType Directory -Force -Path $mirror | Out-Null
          $base = if ($env:PELT_VERSION -eq 'latest') {
            'https://github.com/namnguyen3019/pelt/releases/latest/download'
          } else {
            "https://github.com/namnguyen3019/pelt/releases/download/$env:PELT_VERSION"
          }
          Invoke-WebRequest -UseBasicParsing "$base/pelt_windows_amd64.zip" -OutFile "$mirror\pelt_windows_amd64.zip"
          Set-Content -Path "$mirror\checksums.txt" -Value ('0' * 64 + '  pelt_windows_amd64.zip')
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8081', '--bind', '127.0.0.1', '--directory', $mirror -PassThru
          try {
            for ($i = 0; $i -lt 30; $i++) {
              try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8081/checksums.txt | Out-Null; break } catch { Start-Sleep -Milliseconds 500 }
            }
            $env:PELT_BASE_URL = 'http://127.0.0.1:8081'
            $env:PELT_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'bad-install'
            $env:PELT_NO_MODIFY_PATH = '1'
            $out = Get-Content -Raw .\install.ps1 | Invoke-Expression 6>&1 | Out-String
            $out
            if ($out -notmatch 'checksum mismatch') { throw 'expected a checksum mismatch error' }
            if (Test-Path (Join-Path $env:PELT_INSTALL_DIR 'pelt.exe')) { throw 'pelt.exe was installed despite the bad checksum' }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
