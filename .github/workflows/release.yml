# Builds pelt for every supported OS and CPU and publishes a GitHub Release
# whenever a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Assets: pelt_<os>_<arch>.tar.gz (linux, darwin), pelt_windows_<arch>.zip,
# and checksums.txt with a SHA-256 line for each archive.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Test
        run: go test -race ./...

      - name: Build archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name=pelt_${os}_${arch}
            stage=$(mktemp -d)
            bin=pelt
            [ "$os" = windows ] && bin=pelt.exe
            echo "Building $name ($VERSION)"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags "-s -w" -o "$stage/$bin" ./cmd/pelt
            cp README.md "$stage/"
            if [ "$os" = windows ]; then
              (cd "$stage" && zip -q -X "$GITHUB_WORKSPACE/dist/$name.zip" "$bin" README.md)
            else
              tar -C "$stage" -czf "dist/$name.tar.gz" "$bin" README.md
            fi
            rm -rf "$stage"
          done
          (cd dist && sha256sum pelt_* > checksums.txt)
          cat dist/checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --generate-notes \
            --verify-tag
